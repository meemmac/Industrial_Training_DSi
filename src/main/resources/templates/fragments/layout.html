<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${title} + ' - Student Portal'">Student Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style th:inline="css">
        /* Brand Specific Color (#091f2c) */
        .theme-btn-primary {
            background-color: #091f2c !important;
            border-color: #091f2c !important;
            color: #ffffff !important;
            position: relative;
            overflow: hidden;
            z-index: 1;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        /* The Shining Hover Transition Effect */
        .theme-btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 50%;
            height: 100%;
            background: linear-gradient(
                    90deg,
                    rgba(255, 255, 255, 0) 0%,
                    rgba(255, 255, 255, 0.3) 50%,
                    rgba(255, 255, 255, 0) 100%
            );
            transform: skewX(-25deg);
            z-index: -1;
            transition: none;
        }

        .theme-btn-primary:hover::before, .theme-btn-primary:focus::before {
            left: 150%;
            transition: left 0.6s ease-in-out;
        }

        .theme-btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(9, 31, 44, 0.15);
            color: #ffffff !important;
        }

        /* Active Navigation Tab Styling matching #091f2c */
        .theme-nav-active {
            background-color: #091f2c !important;
            color: #ffffff !important;
            font-weight: 600;
        }

        .text-brand {
            color: #091f2c !important;
        }

        .hover-brand:hover {
            color: #091f2c !important;
        }

        /* Subtle interactive accenting for standard text buttons (like Edit) */
        .text-brand-hover:hover {
            color: #ffffff !important;
            background-color: #091f2c !important;
            border-color: #091f2c !important;
        }
    </style>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<nav th:fragment="nav" class="navbar navbar-expand-md border-bottom shadow-sm py-2" style="background-color: #BAC5D7;">
    <div class="container">
        <a class="navbar-brand fw-bold text-brand" th:href="@{/}">
            🎓 StudentPortal
        </a>
        <!-- Directory and + New Student removed -->
    </div>
</nav>

<footer th:fragment="footer" class="bg-white border-top mt-auto py-4">
    <div class="container small text-muted d-flex justify-content-between align-items-center">
        <span>&copy; <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2026</span> Student Management Module</span>
        <span class="badge bg-light text-secondary border">v1.0.0</span>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</footer>
</body>
</html>
