<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${title} + ' - Student Portal'">Student Management</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Your custom CSS (now contains ALL custom styles) -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

<nav th:fragment="nav" class="navbar navbar-expand-md border-bottom shadow-sm py-2 app-navbar">
    <div class="container">
        <a class="navbar-brand fw-bold text-brand" th:href="@{/}">
            🎓 StudentPortal
        </a>
        <!-- Directory and + New Student removed -->
    </div>
</nav>

<footer th:fragment="footer" class="bg-white border-top mt-auto py-4">
    <div class="container small text-muted d-flex justify-content-between align-items-center">
        <span>&copy; <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2026</span> Student Management Module</span>
        <span class="badge bg-light text-secondary border">v1.0.0</span>
    </div>

    <!-- Bootstrap JS bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</footer>

</body>
</html>
