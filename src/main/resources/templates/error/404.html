<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${title})}"></head>
<body class="bg-light">
<div th:replace="~{fragments/layout :: nav}"></div>

<main class="container py-5" style="max-width: 860px;">
    <div class="card shadow-sm border-0">
        <div class="card-body p-5">
            <div class="badge text-bg-secondary mb-3">404</div>
            <h1 class="h3 mb-2">Page not found</h1>

            <p class="text-muted mb-3" th:text="${message}">
                Student not found with id: 9999
            </p>

            <div class="alert alert-light border mb-4" role="alert">
                <div class="fw-semibold mb-1">What you can do</div>
                <div class="text-muted" th:text="${hint}">
                    Check the ID or go back to the students list.
                </div>
            </div>

            <div class="d-flex gap-2">
                <a class="btn btn-primary"
                   th:href="@{${backUrl}}"
                   th:text="${backLabel}">
                    Back to Students
                </a>

                <a class="btn btn-outline-secondary" th:href="@{/students/new}">
                    Create New Student
                </a>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
