<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Student Details')}">
    <link rel="stylesheet" href="../../static/css/styles.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
<div th:replace="~{fragments/layout :: nav}"></div>

<main class="container py-5" style="max-width: 720px;">

    <!-- Top Nav Action Bar Alignment -->
    <div class="d-flex align-items-center justify-content-between mb-4">
        <a class="text-decoration-none text-secondary small" th:href="@{/students}">
            &larr; Directory List
        </a>

        <div class="d-flex gap-2">
            <a class="btn btn-sm btn-white border shadow-sm text-secondary px-3" th:href="@{/students/{id}/edit(id=${student.id})}">
                Modify Profile
            </a>
            <!-- Delete form uses modal overlay (no onsubmit confirm) -->
            <form th:action="@{/students/{id}/delete(id=${student.id})}" method="post"
                  class="d-inline delete-form" th:attr="data-student-name=${student.name}">
                <button type="button" class="btn btn-sm btn-outline-danger px-3 delete-btn">Remove Profile</button>
            </form>
        </div>
    </div>

    <!-- Data Profile Card Representation Layout -->
    <div class="card shadow-sm border-0 overflow-hidden">
        <div class="card-body p-4 p-md-5">
            <div class="d-flex align-items-center gap-3 mb-4">
                <!-- Beautiful Auto Avatar Graphic Pill element -->
                <div class="text-white rounded-circle d-flex align-items-center justify-content-center fw-bold fs-4"
                     style="width: 56px; height: 56px; background-color: #F5C6BA;"
                     th:text="${#strings.substring(student.name,0,1)}">J</div>
                    <h1 class="h4 fw-bold text-dark mb-0" th:text="${student.name}">John Doe</h1>
                    <span class="badge bg-light text-muted border font-monospace mt-1">Student Information</span>
                </div>
            </div>

            <hr class="text-muted opacity-25 my-4">

            <div class="row g-4">
                <div class="col-sm-4">
                    <div class="text-uppercase tracking-wider font-weight-bold text-muted mb-1" style="font-size: 0.7rem;">Database Ref ID</div>
                    <div class="font-monospace text-dark fw-semibold" th:text="${student.id}">1</div>
                </div>

                <div class="col-sm-8">
                    <div class="text-uppercase tracking-wider font-weight-bold text-muted mb-1" style="font-size: 0.7rem;">Verified Email Address</div>
                    <div>
                        <a class="text-decoration-none text-primary fw-medium" th:href="'mailto:' + ${student.email}" th:text="${student.email}">
                            john@example.com
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete confirmation modal (identical to list page) -->
    <div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header">
                    <h5 class="modal-title">Delete student?</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <p class="mb-0">
                        Are you sure you want to delete <strong id="deleteStudentName">this student</strong>?
                        This action cannot be undone.
                    </p>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
                </div>
            </div>
        </div>
    </div>

</main>

<!-- Footer loads bootstrap.bundle.min.js — must come before the modal script -->
<div th:replace="~{fragments/layout :: footer}"></div>

<!-- Delete confirm — placed AFTER footer so Bootstrap JS is available -->
<script>
    (function () {
        const modalEl = document.getElementById('deleteConfirmModal');
        const confirmBtn = document.getElementById('confirmDeleteBtn');
        const nameEl = document.getElementById('deleteStudentName');
        if (!modalEl || !confirmBtn || typeof bootstrap === 'undefined') return;

        const modal = new bootstrap.Modal(modalEl);
        let formToSubmit = null;

        document.addEventListener('click', function (e) {
            const form = e.target.closest('form.delete-form');
            if (!form) return;

            const deleteBtn = e.target.closest('.delete-btn');
            if (!deleteBtn) return;

            e.preventDefault();

            formToSubmit = form;
            nameEl.textContent = form.getAttribute('data-student-name') || 'this student';
            modal.show();
        });

        confirmBtn.addEventListener('click', function () {
            if (formToSubmit) formToSubmit.submit();
        });
    })();
</script>

</body>
</html>
