<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Student Details')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/layout :: nav}"></div>

<main class="container py-4">

    <div class="d-flex align-items-start justify-content-between mb-3">
        <div>
            <h1 class="h3 mb-1">Student Details</h1>
            <p class="text-muted mb-0">Information about this student.</p>
        </div>

        <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary" th:href="@{/students}">← Back</a>
            <a class="btn btn-primary" th:href="@{/students/{id}/edit(id=${student.id})}">Edit</a>

            <form th:action="@{/students/{id}/delete(id=${student.id})}" method="post"
                  onsubmit="return confirm('Delete this student?');">
                <button type="submit" class="btn btn-outline-danger">Delete</button>
            </form>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <div class="row g-4">
                <div class="col-md-6">
                    <div class="text-muted small mb-1">ID</div>
                    <div class="fs-5 fw-semibold" th:text="${student.id}">1</div>
                </div>

                <div class="col-md-6">
                    <div class="text-muted small mb-1">Name</div>
                    <div class="fs-5 fw-semibold" th:text="${student.name}">John Doe</div>
                </div>

                <div class="col-md-12">
                    <div class="text-muted small mb-1">Email</div>
                    <div class="fs-5">
                        <a class="text-decoration-none"
                           th:href="${'mailto:' + student.email}"
                           th:text="${student.email}">
                            john@example.com
                        </a>
                    </div>
                </div>
            </div>

            <hr class="my-4">

            <div class="d-flex gap-2">
                <a class="btn btn-outline-secondary" th:href="@{/students}">Back to List</a>
                <a class="btn btn-primary" th:href="@{/students/{id}/edit(id=${student.id})}">Edit Student</a>
            </div>
        </div>
    </div>

</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
