<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Students')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/layout :: nav}"></div>

<main class="container py-4">

    <div class="d-flex align-items-center justify-content-between mb-3">
        <div>
            <h1 class="h3 mb-1">Students</h1>
            <p class="text-muted mb-0">View, create, edit, and manage students.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/students/new}">+ Add Student</a>
    </div>

    <!-- Empty state -->
    <div class="card shadow-sm border-0" th:if="${#lists.isEmpty(students)}">
        <div class="card-body p-4">
            <h2 class="h5 mb-2">No students found</h2>
            <p class="text-muted mb-3">Start by adding your first student.</p>
            <a class="btn btn-primary" th:href="@{/students/new}">Create Student</a>
        </div>
    </div>

    <!-- Table -->
    <div class="card shadow-sm border-0" th:if="${!#lists.isEmpty(students)}">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-3">ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th class="text-end pe-3" style="width: 220px;">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="s : ${students}">
                        <td class="ps-3 text-muted" th:text="${s.id}">1</td>
                        <td class="fw-semibold" th:text="${s.name}">John Doe</td>
                        <td>
                            <a class="text-decoration-none" th:href="${'mailto:' + s.email}" th:text="${s.email}">
                                john@example.com
                            </a>
                        </td>
                        <td class="text-end pe-3">
                            <div class="btn-group" role="group">
                                <a class="btn btn-sm btn-outline-secondary"
                                   th:href="@{/students/{id}(id=${s.id})}">
                                    Details
                                </a>

                                <a class="btn btn-sm btn-outline-primary"
                                   th:href="@{/students/{id}/edit(id=${s.id})}">
                                    Edit
                                </a>

                                <form th:action="@{/students/{id}/delete(id=${s.id})}" method="post"
                                      onsubmit="return confirm('Delete this student?');"
                                      class="d-inline">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
