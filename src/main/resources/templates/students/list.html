<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Students')}"></head>
<body class="bg-light d-flex flex-column min-vh-100">
<div th:replace="~{fragments/layout :: nav}" th:with="activeTab='list'"></div>

<main class="container py-5">
    <div class="mb-4">
        <h1 class="h3 font-weight-bold text-dark mb-1">Students Directory</h1>
        <p class="text-secondary">View, manage, and modify registered academic profiles.</p>
    </div>

    <div class="card shadow-sm border-0 text-center py-5 px-4" th:if="${#lists.isEmpty(students)}">
        <div class="card-body">
            <div class="mb-3 fs-1 text-brand">📂</div>
            <h2 class="h5 fw-bold text-dark">No student records found</h2>
            <p class="text-muted mx-auto mb-4" style="max-width: 380px;">
                The student system directory is currently empty. Get started by registering a new student profile.
            </p>
            <a class="btn theme-btn-primary px-4 rounded-pill shadow-sm" th:href="@{/students/new}">
                Add First Student
            </a>
        </div>
    </div>

    <div class="card shadow-sm border-0 overflow-hidden" th:if="${!#lists.isEmpty(students)}">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light text-uppercase fs-7 tracking-wider border-bottom">
                <tr>
                    <th class="ps-4 text-secondary py-3" style="width: 10%">ID</th>
                    <th class="text-secondary py-3">Name</th>
                    <th class="text-secondary py-3">Email</th>
                    <th class="text-end pe-4 py-3" style="width: 25%">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="s : ${students}">
                    <td class="ps-4 font-monospace text-muted small" th:text="${s.id}">1</td>
                    <td>
                        <div class="fw-semibold text-dark" th:text="${s.name}">John Doe</div>
                    </td>
                    <td>
                        <a class="text-decoration-none text-muted hover-brand" th:href="'mailto:' + ${s.email}">
                            <span th:text="${s.email}">john@example.com</span>
                        </a>
                    </td>
                    <td class="text-end pe-4">
                        <div class="btn-group gap-1">
                            <a class="btn btn-sm btn-light border rounded text-secondary"
                               th:href="@{/students/{id}(id=${s.id})}">Details</a>
                            <a class="btn btn-sm btn-light border rounded text-brand text-brand-hover"
                               th:href="@{/students/{id}/edit(id=${s.id})}">Edit</a>
                            <form th:action="@{/students/{id}/delete(id=${s.id})}" method="post"
                                  onsubmit="return confirm('Are you sure you want to delete this profile?');" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-danger rounded">Delete</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
