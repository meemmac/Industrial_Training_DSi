<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${mode} == 'edit' ? 'Edit Student' : 'Create Student')}">
    <link rel="stylesheet" href="../../static/css/styles.css">
</head>
<body class="bg-light">
<div th:replace="~{fragments/layout :: nav}"></div>

<main class="container py-4" style="max-width: 820px;">

    <div class="d-flex align-items-start justify-content-between mb-3">
        <div>
            <h1 class="h3 mb-1" th:text="${mode} == 'edit' ? 'Edit Student' : 'Create Student'">Create Student</h1>
            <p class="text-muted mb-0" th:text="${mode} == 'edit' ? 'Update student information.' : 'Add a new student.'">
                Add a new student.
            </p>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/students}">← Back</a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-4">

            <form method="post"
                  th:action="${mode} == 'edit' ? @{/students/{id}(id=${studentId})} : @{/students}"
                  th:object="${studentForm}"
                  class="needs-validation"
                  novalidate>

                <!-- Name -->
                <div class="mb-3">
                    <label for="name" class="form-label">Name</label>
                    <input id="name"
                           type="text"
                           class="form-control"
                           th:field="*{name}"
                           placeholder="e.g., John Doe">
                    <div class="text-danger small mt-1"
                         th:if="${#fields.hasErrors('name')}"
                         th:errors="*{name}">
                        Name error
                    </div>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input id="email"
                           type="email"
                           class="form-control"
                           th:field="*{email}"
                           placeholder="e.g., john@example.com">
                    <div class="text-danger small mt-1"
                         th:if="${#fields.hasErrors('email')}"
                         th:errors="*{email}">
                        Email error
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"
                            th:text="${mode} == 'edit' ? 'Save Changes' : 'Create Student'">
                        Create Student
                    </button>
                    <a class="btn btn-outline-secondary" th:href="@{/students}">Cancel</a>
                </div>

                <p class="text-muted small mt-3 mb-0">
                    Tip: Use a valid email. Duplicate emails are not allowed.
                </p>

            </form>

        </div>
    </div>

</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
