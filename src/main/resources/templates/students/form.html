<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${mode} == 'edit' ? 'Edit Student' : 'Create Student')}"></head>
<body class="bg-light d-flex flex-column min-vh-100">
<div th:replace="~{fragments/layout :: nav}" th:with="activeTab='form'"></div>

<main class="container py-5" style="max-width: 680px;">
    <div class="mb-3">
        <a class="text-decoration-none text-secondary small d-inline-flex align-items-center gap-1 hover-brand" th:href="@{/students}">
            &larr; Back to Directory
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-4 p-md-5">
            <div class="mb-4">
                <h1 class="h4 fw-bold text-dark mb-1" th:text="${mode} == 'edit' ? 'Update Student Profile' : 'Register New Student'">Create Student</h1>
                <p class="text-muted small" th:text="${mode} == 'edit' ? 'Modify target account authentication details.' : 'Please enter accurate information to create the account profile.'"></p>
            </div>

            <form method="post"
                  th:action="${mode} == 'edit' ? @{/students/{id}(id=${studentId})} : @{/students}"
                  th:object="${studentForm}" novalidate>

                <div class="mb-3">
                    <label for="name" class="form-label fw-semibold small text-secondary">Full Name</label>
                    <input id="name" type="text" class="form-control bg-light-focus" th:field="*{name}"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''" placeholder="e.g. Jane Doe">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>

                <div class="mb-4">
                    <label for="email" class="form-label fw-semibold small text-secondary">Email Address</label>
                    <input id="email" type="email" class="form-control bg-light-focus" th:field="*{email}"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''" placeholder="e.g. jane.doe@school.edu">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                    <a class="btn btn-light border text-secondary px-4" th:href="@{/students}">Cancel</a>
                    <button type="submit" class="btn theme-btn-primary px-4"
                            th:text="${mode} == 'edit' ? 'Save System Changes' : 'Confirm Registration'">
                        Create Student
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
